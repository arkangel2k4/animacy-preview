name: Generate temporary Skurt lockfile

on:
  push:
    branches:
      - tmp/skurt-lockgen-20260727
    paths:
      - tmp/skurt-lockgen/package.json
      - .github/workflows/skurt-lockgen.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/skurt-lockgen-20260727
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile
        env:
          npm_config_package_lock: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: npm install --package-lock-only --ignore-scripts --prefix tmp/skurt-lockgen

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/skurt-lockgen/package-lock.json
          git commit -m "Generate Skurt package lock"
          git push origin HEAD:tmp/skurt-lockgen-20260727
